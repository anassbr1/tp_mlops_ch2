version: 2

models:
  - name: ventes_clean
    description: "Données de ventes nettoyées."
    columns:
      - name: id_client
        tests:
          - not_null
          - unique
      - name: nom
        tests:
          - not_null
      - name: montant
        tests:
          - not_null
      - name: date_vente
        tests:
          - not_null
      - name: region
        tests:
          - not_null
          - accepted_values:
              values: ['Nord', 'Sud', 'Est', 'Ouest']
      - name: statut
        tests:
          - not_null
          - accepted_values:
              values: ['valide']

  - name: ventes_resume
    description: "Agrégation des ventes par région et par mois."
    columns:
      - name: region
        tests:
          - not_null
      - name: annee_mois
        tests:
          - not_null
      - name: nb_transactions
        tests:
          - not_null
      - name: total_ventes
        tests:
          - not_null
      - name: panier_moyen
        tests:
          - not_null

  - name: ventes_resume
    description: "Agrégation des ventes par région et par mois."
    columns:
      - name: region
        description: "Région géographique"
        tests:
          - not_null

      - name: annee_mois
        description: "Mois de la vente (YYYY-MM)"
        tests:
          - not_null

      - name: nb_transactions
        description: "Nombre de transactions"
        tests:
          - not_null

      - name: total_ventes
        description: "Total des montants (€)"
        tests:
          - not_null

      - name: panier_moyen
        description: "Montant moyen par transaction (€)"
        tests:
          - not_null
