name: CI Pipeline MLOps

# Déclenchement : à chaque push ou pull request sur main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: Vérification du pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installer Python 3.11
      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Mettre en cache pip pour accélérer les builds suivants
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Installer les dépendances
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Vérification syntaxique des scripts Python
      - name: Vérification syntaxique Python (py_compile)
        run: |
          python -m py_compile pipeline/ingest.py
          python -m py_compile pipeline/validate.py
          python -m py_compile pipeline/orchestrate.py
          echo "✓ Syntaxe Python OK"

      # 6. Vérifier que les fichiers essentiels sont présents
      - name: Vérifier la présence des fichiers clés
        run: |
          test -f data/ventes.csv             && echo "✓ data/ventes.csv"
          test -f pipeline/ingest.py          && echo "✓ pipeline/ingest.py"
          test -f pipeline/validate.py        && echo "✓ pipeline/validate.py"
          test -f pipeline/orchestrate.py     && echo "✓ pipeline/orchestrate.py"
          test -f dbt_pipeline/dbt_project.yml && echo "✓ dbt_pipeline/dbt_project.yml"
          test -f dbt_pipeline/profiles.yml   && echo "✓ dbt_pipeline/profiles.yml"
          test -f requirements.txt            && echo "✓ requirements.txt"

      # 7. Lancer l'ingestion
      - name: Ingestion (dlt)
        run: python pipeline/ingest.py

      # 8. Lancer la validation
      - name: Validation des données
        run: python pipeline/validate.py

      # 9. Lancer dbt run
      - name: Transformation dbt (dbt run)
        run: |
          dbt run \
            --project-dir dbt_pipeline \
            --profiles-dir dbt_pipeline

      # 10. Lancer dbt test
      - name: Tests dbt (dbt test)
        run: |
          dbt test \
            --project-dir dbt_pipeline \
            --profiles-dir dbt_pipeline

      # 11. Résumé
      - name: Résumé CI
        run: echo "✓ Tous les contrôles CI ont réussi !"
